<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifier le produit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-warning text-dark">
            <h2>Modifier le produit</h2>
        </div>
        <div class="card-body">
            <form th:action="@{'/products/edit/' + ${product.id}}" th:object="${product}" method="post">
                
                <div class="mb-3">
                    <label for="name" class="form-label">Nom</label>
                    <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="Nom du produit">
                    <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea th:field="*{description}" class="form-control" id="description" placeholder="Description"></textarea>
                    <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                </div>

                <div class="mb-3">
                    <label for="price" class="form-label">Prix (€)</label>
                    <input type="number" step="0.01" th:field="*{price}" class="form-control" id="price">
                    <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                </div>

                <div class="mb-3">
                    <label for="stock" class="form-label">Stock</label>
                    <input type="number" th:field="*{stock}" class="form-control" id="stock">
                    <div class="text-danger" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
                </div>

                <div class="mb-3">
                    <label for="createdAt" class="form-label">Date de création</label>
                    <input type="date" th:field="*{createdAt}" class="form-control" id="createdAt">
                    <div class="text-danger" th:if="${#fields.hasErrors('createdAt')}" th:errors="*{createdAt}"></div>
                </div>

                <button type="submit" class="btn btn-primary">Enregistrer</button>
                <a href="/products" class="btn btn-secondary">Annuler</a>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
