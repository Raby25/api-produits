<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détails du produit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h2 th:text="'Détails du produit : ' + ${product.name}"></h2>
        </div>
        <div class="card-body">
            <ul class="list-group list-group-flush">
                <li class="list-group-item"><strong>ID :</strong> <span th:text="${product.id}"></span></li>
                <li class="list-group-item"><strong>Nom :</strong> <span th:text="${product.name}"></span></li>
                <li class="list-group-item"><strong>Description :</strong> <span th:text="${product.description}"></span></li>
                <li class="list-group-item"><strong>Prix (€) :</strong> <span th:text="${product.price}"></span></li>
                <li class="list-group-item"><strong>Stock :</strong> <span th:text="${product.stock}"></span></li>
                <li class="list-group-item"><strong>Date de création :</strong> 
                    <span th:text="${#dates.format(product.createdAt, 'yyyy-MM-dd')}"></span>
                </li>
            </ul>
        </div>
        <div class="card-footer">
            <a href="/products" class="btn btn-secondary">Retour à la liste</a>
            <a th:href="@{'/products/edit/' + ${product.id}}" class="btn btn-primary">Modifier</a>
            <a th:href="@{'/products/delete/' + ${product.id}}" class="btn btn-danger">Supprimer</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
